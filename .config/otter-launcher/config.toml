[general]
default_module = "app"
empty_module = "a"

exec-cmd = "sh -c"
vi_mode = false
esc_to_abort = true

cheatsheet_entry = "?"
cheatsheet_viewer = "less -R; clear"

[interface]
header = """
 \u001B[34;1m  >\u001B[0m $USER@$(echo $HOSTNAME)                \u001B[31m\u001B[0m $(cat /proc/loadavg | cut -d ' ' -f 1)  \u001B[33m󰍛\u001B[0m $(free -h | awk 'FNR == 2 {print $3}' | sed 's/i//')
    \u001B[34;1m>\u001B[0;1m """
list_prefix = "    "
selection_prefix = "    \u001B[31;1m> "
place_holder = "type to filter commands"
suggestion_mode = "list" # available options: list, hint
suggestion_lines = 12
indicator_with_arg_module = "\u001B[31m^\u001B[0m "
indicator_no_arg_module = "\u001B[31m$\u001B[0m "
prefix_padding = 3
move_right = 0
move_up = 0
padding = 4


[[modules]]
description = "duckduckgo search"
prefix = "dgg"
cmd = "xdg-open https://www.duckduckgo.com/search?='{}'"
with_argument = true
url_encode = true

[[modules]]
description = "launch fsel"
prefix = "a"
cmd = "fsel -vv -r -d -ss \"{}\""
with_argument = true

[[modules]]
description = "launch app through fsel"
prefix = "app"
cmd = "fsel -vv -r -d -p {}"
with_argument = true

[[modules]]
description = "manage clipboard with fsep & cclip"
prefix = "cl"
cmd = "fsel --cclip"

[[modules]]
description = "install packages"
prefix = "i"
cmd = "paru -S {}"
with_argument = true

[[modules]]
description = "run command in terminal"
prefix = "sh"
cmd = """
$(printf $TERM | sed 's/xterm-//g') -e sh -c "{}"
"""
with_argument = true

[[modules]]
description = "search jpdb"
prefix = "jp"
cmd = "xdg-open 'https://jpdb.io/search?='{}'"
with_argument = true

[[modules]]
description = "edit text file with neovim"
prefix = "nv"
cmd = "foot nvim {}"
with_argument = true

